services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # Shares gluetun's network namespace so every byte of qBittorrent's
    # traffic exits via the ProtonVPN WireGuard tunnel. Ports are
    # published from gluetun's compose (see configure/gluetun/) — a
    # netns has exactly one set of port bindings and gluetun owns them.
    # No extra_hosts here either; host.docker.internal resolution lives
    # on gluetun's side.
    network_mode: "container:gluetun"
    # PUID / PGID / TZ are substituted from the env that configure.sh
    # passes through sudo. PUID/PGID matter so anything qbittorrent
    # writes under the bind-mounted volumes is owned by the host user,
    # not by root inside the container.
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${HOME}/library/.config/qbittorrent:/config
      - ${HOME}/library/downloads:/downloads
    restart: unless-stopped
