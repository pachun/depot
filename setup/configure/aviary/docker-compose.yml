services:
  aviary:
    build:
      # Source clone lives at ~/library/apps/aviary; configure.sh
      # passes its absolute path through SRC so this compose file
      # doesn't have to know about the host's home directory.
      context: ${SRC}
    container_name: aviary
    environment:
      # PHX_SERVER=true is what tells the release to actually start
      # the Endpoint — without it the release boots and idles.
      - PHX_SERVER=true
      # Phoenix uses PHX_HOST to construct absolute URLs (redirects,
      # asset hosts). Set to this box's hostname so links land at
      # http://<hostname>:4000/... — reachable over Tailscale MagicDNS
      # from any device on the tailnet.
      - PHX_HOST=${PHX_HOST}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      # Jellyfin reach from inside the container — host.docker.internal
      # routes back to the host's bridge gateway, where Jellyfin is
      # publishing on 8096. Faster than going out to Tailscale and back,
      # and avoids needing Tailscale's CA cert plumbed into the image.
      - JELLYFIN_URL=${JELLYFIN_URL}
      # Public URL used by the user's browser for video stream playback;
      # host.docker.internal isn't reachable from outside the container.
      # configure.sh sets this to the tailnet HTTPS URL Jellyfin serves
      # at via Tailscale Serve.
      - JELLYFIN_PUBLIC_URL=${JELLYFIN_PUBLIC_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      # Jellyseerr powers the release-calendar widget. Internal docker
      # bridge path matches the Jellyfin pattern — the browser never
      # touches Jellyseerr directly, so a public URL isn't needed.
      - JELLYSEERR_URL=${JELLYSEERR_URL}
      - JELLYSEERR_API_KEY=${JELLYSEERR_API_KEY}
      - TZ=${TZ}
    ports:
      - 4000:4000
    # Future: when aviary needs to call Jellyfin/Sonarr/Radarr/etc.
    # over the host's bridge network, host.docker.internal resolves
    # to the host. Already wired up so we don't have to redo the
    # plumbing when those API calls start landing.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
