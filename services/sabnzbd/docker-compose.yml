services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8085:8080
    # Lets sabnzbd reach sonarr (8989) / radarr (7878) by name for the
    # default category-completion notification path. Same pattern as
    # the arr containers.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DEPOT_USER_HOME}/hdds/.config/sabnzbd:/config
      # Usenet workload stays on the SSD end-to-end: incomplete jobs
      # AND par2/unrar reassembly happen on /usenet, then the arrs
      # cross-filesystem import directly from /usenet into
      # ~/hdds/media/{tv,movies}. No HDD-side staging dir for Usenet
      # because SAB doesn't seed — once import lands, the SSD copy
      # can go away. (No hardlink possible across SSD→HDD, so the
      # arr does copy+delete on import, which runs once per file.)
      - ${DEPOT_USER_HOME}/downloading/usenet:/usenet
    # Docker copies the host's /etc/resolv.conf into the container once,
    # at start. After a whole-office power cut the NAS boots before the
    # router answers, that file is still empty at that instant, and the
    # container comes up unable to resolve any name (2026-11-04). Naming
    # the resolver here removes the race; the router intercepts and
    # answers plain DNS regardless, so behavior is otherwise unchanged.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    restart: unless-stopped
