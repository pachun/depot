services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    # NET_ADMIN + /dev/net/tun are how gluetun stands up the WireGuard
    # interface inside its container.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      # NAT-PMP port forwarding from ProtonVPN. PORT_FORWARD_ONLY=on
      # filters server selection to PMP-capable endpoints so we always
      # get an inbound port. STATUS_FILE writes the allocated port into
      # the bind-mounted /gluetun volume (default would be /tmp/gluetun
      # which is in-container only) — summary.sh reads it from there.
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/forwarded_port
      # Fires whenever a NAT-PMP port is allocated or rotates. The
      # script pushes the new port into qBittorrent's listening-port
      # setting via its WebUI API, so qBittorrent stays in sync with
      # ProtonVPN without any manual paste. {{PORTS}} is gluetun's
      # placeholder for the allocated port.
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh /gluetun/qbit-port-sync.sh {{PORTS}}
      # LAN (192.168/16) + Docker bridges (172.16/12) + Tailscale CGNAT
      # (100.64/10). Without these, gluetun's killswitch would drop
      # response packets on the qBittorrent WebUI when reached from
      # clients on those networks.
      #
      # Do NOT include 10.0.0.0/8: ProtonVPN's WireGuard gateway lives
      # at 10.2.0.1, and whitelisting it as LAN makes gluetun send the
      # NAT-PMP request out the bridge interface instead of through the
      # tunnel. Port forwarding then dies with `i/o timeout` on
      # 10.2.0.1:5351 after 9 retries.
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16,172.16.0.0/12,100.64.0.0/10
    # Published here because qBittorrent shares this netns. A netns
    # has exactly one set of port bindings and gluetun owns them.
    ports:
      # qBittorrent web UI.
      - 8080:8080
      # BitTorrent peer port (TCP for wire protocol, UDP for DHT/uTP).
      - 6881:6881
      - 6881:6881/udp
    volumes:
      # Persist gluetun's state — most notably /gluetun/forwarded_port,
      # which is how we surface the NAT-PMP port to summary.sh and the
      # README's qBittorrent step.
      - ${DEPOT_USER_HOME}/hdds/.config/gluetun:/gluetun
    restart: unless-stopped
