services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 6767:6767
    # Reaches Sonarr (8989), Radarr (7878) and Jellyfin (8096) on the
    # host by name. Same pattern as sonarr/radarr.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DEPOT_USER_HOME}/hdds/.config/bazarr:/config
      # The libraries at the same in-container paths Sonarr and Radarr
      # use (/shows, /movies), so the file paths Bazarr learns from
      # their APIs resolve without any path mapping. Subtitles are
      # written next to the video as <video>.en.srt.
      - ${DEPOT_USER_HOME}/hdds/media/shows:/shows
      - ${DEPOT_USER_HOME}/hdds/media/movies:/movies
      # sync-subtitle.sh (in /config) re-times each downloaded subtitle
      # with alass, splitting it where the two cuts differ. Bazarr's
      # built-in sync can only shift and stretch. Bazarr.install fetches
      # the static binary into the config dir.
      - ${DEPOT_USER_HOME}/hdds/.config/bazarr/alass:/usr/local/bin/alass:ro
    # Docker copies the host's /etc/resolv.conf into the container once,
    # at start. After a whole-office power cut the NAS boots before the
    # router answers, that file is still empty at that instant, and the
    # container comes up unable to resolve any name (2026-11-04). Naming
    # the resolver here removes the race; the router intercepts and
    # answers plain DNS regardless, so behavior is otherwise unchanged.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    restart: unless-stopped
