services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 7878:7878
    # Lets radarr reach prowlarr (9696) and qbittorrent (8080) by name
    # rather than by docker-bridge IP. Same pattern as sonarr/prowlarr.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DEPOT_USER_HOME}/hdds/.config/radarr:/config
      # See sonarr/docker-compose.yml for the rationale on these two
      # download-client mounts (qBit on /seeding, SAB on /usenet).
      - ${DEPOT_USER_HOME}/hdds/seeding:/seeding
      - ${DEPOT_USER_HOME}/downloading/usenet:/usenet
      # Radarr's "root folder" — imported/renamed movies land here.
      # On the HDD pool, hardlink-compatible with /seeding.
      - ${DEPOT_USER_HOME}/hdds/media/movies:/movies
    restart: unless-stopped
