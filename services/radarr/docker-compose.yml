services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 7878:7878
    # Lets radarr reach prowlarr (9696) and qbittorrent (8080) by name
    # rather than by docker-bridge IP. Same pattern as sonarr/prowlarr.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DEPOT_USER_HOME}/hdds/.config/radarr:/config
      # See sonarr/docker-compose.yml for the rationale on these two
      # download-client mounts (qBit on /seeding, SAB on /usenet).
      - ${DEPOT_USER_HOME}/hdds/seeding:/seeding
      - ${DEPOT_USER_HOME}/downloading/usenet:/usenet
      # Radarr's "root folder" — imported/renamed movies land here.
      # On the HDD pool, hardlink-compatible with /seeding.
      - ${DEPOT_USER_HOME}/hdds/media/movies:/movies
    # Docker copies the host's /etc/resolv.conf into the container once,
    # at start. After a whole-office power cut the NAS boots before the
    # router answers, that file is still empty at that instant, and the
    # container comes up unable to resolve any name (2026-11-04). Naming
    # the resolver here removes the race; the router intercepts and
    # answers plain DNS regardless, so behavior is otherwise unchanged.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    restart: unless-stopped
