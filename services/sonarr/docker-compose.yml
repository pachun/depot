services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8989:8989
    # Lets sonarr reach prowlarr (9696) and qbittorrent (8080) by name
    # rather than by docker-bridge IP. See prowlarr/docker-compose.yml
    # for the same rationale.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DEPOT_USER_HOME}/hdds/.config/sonarr:/config
      # Two download-client surfaces — qBit (/seeding, HDD pool) and
      # SAB (/usenet, SSD). Container path = last segment of host
      # path everywhere, so qBit's "save_path=/seeding" matches what
      # sonarr sees at /seeding, and the same translation applies to
      # /usenet.
      - ${DEPOT_USER_HOME}/hdds/seeding:/seeding
      - ${DEPOT_USER_HOME}/downloading/usenet:/usenet
      # Sonarr's "root folder" — imported/renamed episodes land here.
      # On the HDD pool with /seeding (same ZFS dataset → hardlinks
      # work, no double-storage during seeding). /usenet is on a
      # different filesystem, so SAB imports use copy+delete, which
      # is fine for one-time-per-file work.
      - ${DEPOT_USER_HOME}/hdds/media/shows:/shows
    # Docker copies the host's /etc/resolv.conf into the container once,
    # at start. After a whole-office power cut the NAS boots before the
    # router answers, that file is still empty at that instant, and the
    # container comes up unable to resolve any name (2026-11-04). Naming
    # the resolver here removes the race; the router intercepts and
    # answers plain DNS regardless, so behavior is otherwise unchanged.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    restart: unless-stopped
