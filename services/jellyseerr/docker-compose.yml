services:
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    # fallenbagel/jellyseerr (unlike the linuxserver images) doesn't
    # use PUID/PGID — it runs as the container's internal node user
    # (UID 1000). The host's first user is also UID 1000, so files
    # written to the bind-mounted config directory end up owned by
    # the host user without extra plumbing.
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    ports:
      - 5055:5055
    # Lets jellyseerr reach jellyfin (8096), sonarr (8989), and
    # radarr (7878) by name rather than by docker-bridge IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${DEPOT_USER_HOME}/hdds/.config/jellyseerr:/app/config
    # Docker copies the host's /etc/resolv.conf into the container once,
    # at start. After a whole-office power cut the NAS boots before the
    # router answers, that file is still empty at that instant, and the
    # container comes up unable to resolve any name (2026-11-04). Naming
    # the resolver here removes the race; the router intercepts and
    # answers plain DNS regardless, so behavior is otherwise unchanged.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    restart: unless-stopped
