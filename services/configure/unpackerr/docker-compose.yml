services:
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    # No web UI; no published ports. The container is a daemon that
    # watches the download trees, extracts archives as they appear,
    # and pokes Sonarr/Radarr's APIs to re-trigger import once a
    # release that was a RAR/7z lands as a usable .mkv on disk.
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Both tiers exposed to the arrs — qBit completes on the HDD
      # pool at /seeding, SAB on the SSD at /usenet. Same in-container
      # paths the arr containers use, so the arr's queue path matches
      # what unpackerr sees.
      - UN_SONARR_0_URL=http://host.docker.internal:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/seeding
      - UN_SONARR_0_PATHS_1=/usenet
      - UN_RADARR_0_URL=http://host.docker.internal:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/seeding
      - UN_RADARR_0_PATHS_1=/usenet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read+write needed — unpackerr extracts archives in place, then
      # cleans up the archive after a 5-minute grace period.
      - ${HOME}/hdds/seeding:/seeding
      - ${HOME}/downloading/usenet:/usenet
    restart: unless-stopped
