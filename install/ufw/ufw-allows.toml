# ufw allow rules. Each [[allow]] block must have both `what` and `why`.
# The install script refuses to apply if either field is missing.
#
# Each `what` value is passed verbatim to `ufw allow`. Three valid forms:
#
#   - Service name — looks up /etc/services for the port
#       e.g. "ssh", "http", "https"
#       Check whether a name is recognized: `getent services <name>`
#
#   - Port number, with optional protocol
#       e.g. "8096", "8096/tcp"
#       Bare port opens both tcp and udp; add /tcp or /udp to restrict.
#
#   - ufw app profile — multi-port rules bundled by installed packages
#       e.g. "Samba"
#       List available profiles on this machine: `ufw app list`
#
# Use service names for well-known protocols, port numbers for
# app-specific ports, and app profiles when a package ships one.

[[allow]]
what = "ssh"
why = "remote management"
