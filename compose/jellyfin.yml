services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    # PUID / PGID / TZ get substituted from the env that configure.sh
    # passes through sudo. PUID/PGID matter so anything jellyfin writes
    # under the bind-mounted volumes is owned by the host user, not by
    # root inside the container.
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    # Host networking simplifies discovery (DLNA, AutoDiscovery) and
    # avoids the docker network double-NAT for streaming. Single-user
    # NAS — security trade-off is fine.
    network_mode: host
    # Pass Intel iGPU through for QuickSync hardware-accelerated
    # transcoding. Without this, every transcode runs on the CPU and
    # 1080p eats every core (loud fans, grainy output because the
    # software encoder can't keep up at quality). configure.sh
    # follows up by enabling QSV via the System/Configuration/encoding
    # REST API, so no manual Dashboard step is needed. The LSIO image's
    # startup script grants the container user render-group access
    # automatically.
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${DEPOT_USER_HOME}/hdds/.config/jellyfin:/config
      - ${DEPOT_USER_HOME}/hdds/media:/media
    restart: unless-stopped
